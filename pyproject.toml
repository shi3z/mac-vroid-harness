[project]
name = "vroid-harness"
version = "0.1.0"
description = "MCP server that lets Claude Code see and drive VRoid Studio on macOS"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2,<2",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Vision>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
]

[project.scripts]
vroid-harness = "vroid_harness.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vroid_harness"]
